<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soundscape Audition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: light;
  --paper: #F6F5F1;
  --surface: #FFFFFF;
  --surface-2: #EFEDE7;
  --line: #DEDBD2;
  --ink: #0B0B0E;
  --ink-2: #3A3A40;
  --muted: #6F6E6B;
  --accent: #0D9488;
  --accent-soft: #E3F5F2;
  --violet: #6366F1;
  --violet-soft: #ECECFE;
  --shadow: 0 1px 2px rgba(11, 11, 14, 0.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0A0A0C;
    --surface: #131318;
    --surface-2: #1C1C23;
    --line: #2A2A33;
    --ink: #F5F5F7;
    --ink-2: #C9C9D1;
    --muted: #8A8A94;
    --accent: #2DD4BF;
    --accent-soft: #0E2A28;
    --violet: #8B8DF7;
    --violet-soft: #1B1B2E;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0A0A0C;
  --surface: #131318;
  --surface-2: #1C1C23;
  --line: #2A2A33;
  --ink: #F5F5F7;
  --ink-2: #C9C9D1;
  --muted: #8A8A94;
  --accent: #2DD4BF;
  --accent-soft: #0E2A28;
  --violet: #8B8DF7;
  --violet-soft: #1B1B2E;
  --shadow: none;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Manrope, ui-sans-serif, system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: "Geist Mono", ui-monospace, monospace; }
header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 1080px;
  margin: 0 auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: Unbounded, Manrope, sans-serif;
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.02em;
  margin: 0;
}
.count { font-size: 12px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
.count b { color: var(--accent); font-size: 14px; }
.track { height: 3px; border-radius: 2px; background: var(--surface-2); overflow: hidden; }
.track span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 240ms ease; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 999px;
  padding: 5px 12px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  font-family: inherit;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 80px; }
.group-title {
  font-family: "Geist Mono", monospace;
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 28px 0 12px;
}
.group-title:first-child { margin-top: 0; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card.done { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.card.skipped { opacity: 0.55; }
.card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.card-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
.tagid { font-size: 11.5px; color: var(--muted); }
.kind {
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 5px;
  font-weight: 600;
}
.kind.bed { background: var(--violet-soft); color: var(--violet); }
.kind.shot { background: var(--accent-soft); color: var(--accent); }
.spacer { flex: 1; }
.skip {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
  font-family: inherit;
}
.skip[aria-pressed="true"] { background: var(--surface-2); color: var(--ink-2); }
.row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
  position: relative;
}
.row:first-child { border-top: none; }
.row.chosen { background: var(--accent-soft); }
.play {
  flex: none;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-family: inherit;
}
.row.playing .play { background: var(--accent); border-color: var(--accent); color: #fff; }
.info { min-width: 0; flex: 1; }
.name { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.keep {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}
.row.chosen .keep { background: var(--accent); border-color: var(--accent); color: #fff; }
.seek { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--accent); width: 0; }
.src { font-size: 11.5px; color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--line); }
.src:hover { color: var(--ink-2); }
footer { max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; color: var(--muted); font-size: 12.5px; }
.saving { color: var(--accent); }
.failed { color: #E11D48; }
@media (max-width: 560px) {
  .keep { padding: 6px 10px; }
  .meta span:nth-child(n+3) { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="top">
      <h1>Soundscape Audition</h1>
      <div class="count"><b id="done">0</b> of <span id="total">0</span> tags decided · <span id="status">saved to disk</span></div>
    </div>
    <div class="track"><span id="progress"></span></div>
    <div class="filters">
      <button class="chip" data-filter="all" aria-pressed="true">All</button>
      <button class="chip" data-filter="undecided" aria-pressed="false">Undecided</button>
      <button class="chip" data-filter="picked" aria-pressed="false">Picked</button>
      <button class="chip" data-filter="bed" aria-pressed="false">Ambience beds</button>
      <button class="chip" data-filter="shot" aria-pressed="false">One-shots</button>
    </div>
  </div>
</header>
<main id="list"></main>
<footer>
  Every candidate is CC0 from Freesound. Beds start a quarter of the way in so you hear the body of the recording, not its fade-in. Picks save to <span class="mono">scripts/sounds/picks.json</span> as you go.
</footer>
<script>
const DATA = __DATA__;
const PICKS = __PICKS__;

const picks = new Map(Object.entries(PICKS));
const list = document.getElementById("list");
const statusEl = document.getElementById("status");
const doneEl = document.getElementById("done");
const progressEl = document.getElementById("progress");
document.getElementById("total").textContent = DATA.length;

const audio = new Audio();
let playingRow = null;
let seekStart = 0;

function fmt(seconds) {
  const s = Math.round(seconds);
  return s >= 60 ? Math.floor(s / 60) + "m " + String(s % 60).padStart(2, "0") + "s" : s + "s";
}

function stop() {
  audio.pause();
  if (playingRow) {
    playingRow.classList.remove("playing");
    playingRow.querySelector(".seek").style.width = "0";
    playingRow = null;
  }
}

function play(row, cand, kind) {
  if (playingRow === row) {
    stop();
    return;
  }
  stop();
  playingRow = row;
  row.classList.add("playing");
  seekStart = kind === "bed" && cand.duration > 40 ? cand.duration * 0.25 : 0;
  audio.src = cand.preview;
  audio.play().catch(() => {
    row.classList.add("failed");
    stop();
  });
}

audio.addEventListener("loadedmetadata", () => {
  if (seekStart > 0) {
    audio.currentTime = seekStart;
    seekStart = 0;
  }
});
audio.addEventListener("timeupdate", () => {
  if (!playingRow || !audio.duration) return;
  playingRow.querySelector(".seek").style.width = (audio.currentTime / audio.duration) * 100 + "%";
});
audio.addEventListener("ended", stop);

async function save(tag, body) {
  if (body === null) picks.delete(tag);
  else picks.set(tag, body);
  refresh();
  statusEl.textContent = "saving…";
  statusEl.className = "saving";
  try {
    const res = await fetch("/api/pick", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ tag, pick: body }),
    });
    if (!res.ok) throw new Error(String(res.status));
    statusEl.textContent = "saved to disk";
    statusEl.className = "";
  } catch {
    statusEl.textContent = "not saved — is the server running?";
    statusEl.className = "failed";
  }
}

function refresh() {
  let decided = 0;
  for (const tag of DATA) {
    const pick = picks.get(tag.tag);
    if (pick) decided++;
    const card = document.getElementById("card-" + tag.tag);
    card.classList.toggle("done", Boolean(pick) && !pick?.skipped);
    card.classList.toggle("skipped", Boolean(pick?.skipped));
    card.querySelector(".skip").setAttribute("aria-pressed", String(Boolean(pick?.skipped)));
    for (const row of card.querySelectorAll(".row")) {
      const chosen = Boolean(pick) && !pick.skipped && String(pick.id) === row.dataset.id;
      row.classList.toggle("chosen", chosen);
      row.querySelector(".keep").textContent = chosen ? "Kept" : "Keep";
    }
  }
  doneEl.textContent = decided;
  progressEl.style.width = (decided / DATA.length) * 100 + "%";
  applyFilter();
}

let filter = "all";
function applyFilter() {
  for (const tag of DATA) {
    const pick = picks.get(tag.tag);
    const card = document.getElementById("card-" + tag.tag);
    const show =
      filter === "all" ||
      (filter === "undecided" && !pick) ||
      (filter === "picked" && pick && !pick.skipped) ||
      filter === tag.kind;
    card.hidden = !show;
  }
  for (const group of document.querySelectorAll(".group-title")) {
    const cards = [...document.querySelectorAll('[data-group="' + group.dataset.group + '"]')];
    group.hidden = cards.every((c) => c.hidden);
  }
}

for (const chip of document.querySelectorAll(".chip")) {
  chip.addEventListener("click", () => {
    filter = chip.dataset.filter;
    for (const other of document.querySelectorAll(".chip")) {
      other.setAttribute("aria-pressed", String(other === chip));
    }
    applyFilter();
  });
}

const groups = [
  ["bed", "Ambience beds"],
  ["shot", "One-shots"],
];
for (const [kind, label] of groups) {
  const heading = document.createElement("div");
  heading.className = "group-title";
  heading.dataset.group = kind;
  heading.textContent = label;
  list.append(heading);
  for (const tag of DATA.filter((t) => t.kind === kind)) {
    const card = document.createElement("section");
    card.className = "card";
    card.id = "card-" + tag.tag;
    card.dataset.group = kind;

    const head = document.createElement("div");
    head.className = "card-head";
    const title = document.createElement("h2");
    title.textContent = tag.label;
    const id = document.createElement("span");
    id.className = "tagid mono";
    id.textContent = tag.tag;
    const chip = document.createElement("span");
    chip.className = "kind " + kind;
    chip.textContent = kind === "bed" ? "bed" : "shot";
    const spacer = document.createElement("div");
    spacer.className = "spacer";
    const skip = document.createElement("button");
    skip.className = "skip";
    skip.type = "button";
    skip.textContent = "None of these";
    skip.addEventListener("click", () => {
      const current = picks.get(tag.tag);
      stop();
      save(tag.tag, current?.skipped ? null : { skipped: true, tag: tag.tag, kind });
    });
    head.append(title, id, chip, spacer, skip);
    card.append(head);

    for (const cand of tag.candidates) {
      const row = document.createElement("div");
      row.className = "row";
      row.dataset.id = String(cand.id);

      const playBtn = document.createElement("button");
      playBtn.className = "play";
      playBtn.type = "button";
      playBtn.textContent = "▶";
      playBtn.setAttribute("aria-label", "Play " + cand.name);
      playBtn.addEventListener("click", () => play(row, cand, kind));

      const info = document.createElement("div");
      info.className = "info";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = cand.name;
      const meta = document.createElement("div");
      meta.className = "meta mono";
      const bits = [
        fmt(cand.duration),
        cand.ratings >= 3 ? "★ " + cand.rating.toFixed(1) : "unrated",
        cand.downloads.toLocaleString() + " downloads",
        cand.channels === 2 ? "stereo" : "mono",
      ];
      for (const bit of bits) {
        const span = document.createElement("span");
        span.textContent = bit;
        meta.append(span);
      }
      const link = document.createElement("a");
      link.className = "src mono";
      link.href = cand.page;
      link.target = "_blank";
      link.rel = "noreferrer";
      link.textContent = "by " + cand.user;
      meta.append(link);
      info.append(name, meta);

      const keep = document.createElement("button");
      keep.className = "keep";
      keep.type = "button";
      keep.textContent = "Keep";
      keep.addEventListener("click", () => {
        const current = picks.get(tag.tag);
        if (current && !current.skipped && String(current.id) === String(cand.id)) {
          save(tag.tag, null);
          return;
        }
        save(tag.tag, {
          tag: tag.tag,
          kind,
          label: tag.label,
          id: cand.id,
          name: cand.name,
          user: cand.user,
          duration: cand.duration,
          preview: cand.preview,
          page: cand.page,
          license: "CC0",
        });
      });

      const seek = document.createElement("div");
      seek.className = "seek";

      row.append(playBtn, info, keep, seek);
      card.append(row);
    }
    list.append(card);
  }
}

refresh();
</script>
</body>
</html>
